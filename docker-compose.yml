services:
  app:
    build: .
    image: legado-web:latest
    container_name: legado-web
    restart: unless-stopped
    ports:
      - "18080:18080"
    volumes:
      - ./data:/data
    environment:
      PORT: "18080"
      DATA_DIR: /data
      TZ: Asia/Shanghai
      LOG_LEVEL: info
      SEED_CORPUS: "1"
      # HTTP_PROXY: http://host.docker.internal:7890
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
